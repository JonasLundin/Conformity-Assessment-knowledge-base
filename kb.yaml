# Bundle manifest read by tools/validate.py. Add a category or section here before using it in wiki/.
manifest_version: 1
okf_version: '0.2'
slug: conformity-assessment
name: Conformity Assessment Knowledge Base
description: 'EU conformity assessment: the New Legislative Framework, the Decision 768/2008/EC modules, accreditation, notification
  and notified bodies, certification schemes, and their use in the CRA, the AI Act and other product law.'
extension_key: x-conformity-assessment
categories:
- law
- requirement
- guidance
- standard
- role
- procedure
- authority
- jurisdiction
- timeline
- glossary
- module
- scheme
sections:
- path: law
  title: Law
  description: Horizontal instruments of the New Legislative Framework and the sector laws that build on them.
- path: modules
  title: Modules
  description: The conformity assessment modules of Decision 768/2008/EC Annex II, one page per module, with the sector variants
    that reference them.
- path: procedures
  title: Procedures
  description: How bodies become and stay competent, and how assessment and certificates work.
- path: roles
  title: Roles
  description: Manufacturer, authorised representative, importer, distributor, conformity assessment body, notified body,
    notifying authority, national accreditation body, EA, market surveillance authority, the Commission.
- path: standards
  title: Standards
  description: The ISO/CASCO toolbox and its European adoptions, recorded as identifiers, scope and links.
- path: schemes
  title: Schemes
  description: Certification schemes that sit beside notified-body assessment.
- path: guidance
  title: Guidance
  description: Official non-binding guidance.
- path: jurisdictions
  title: Jurisdictions
  description: Each Member State's notifying authorities and national accreditation body, with the sector designations that
    matter for cybersecurity and AI.
- path: timeline
  title: Timeline
  description: The 2008 framework, Regulation (EU) 2019/1020 application, the Cybersecurity Act, EUCC, the CRA Chapter IV
    date, the AI Act and Machinery Regulation notified-body dates.
- path: glossary
  title: Glossary
  description: Terms defined in Regulation (EC) No 765/2008, Decision 768/2008/EC, Regulation (EU) 2019/1020 and ISO/IEC 17000.
